<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사회문제탐구 설문 참여</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#18243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:30px 18px}header{background:#172c59;color:white;padding:26px;border-radius:20px}h1{margin:0 0 9px;font-size:27px}p{line-height:1.6}.panel{background:white;border:1px solid #e1e6f0;border-radius:18px;padding:20px;margin-top:18px}.login{display:flex;gap:10px;flex-wrap:wrap}input{padding:13px;border:1px solid #bcc8da;border-radius:10px;font-size:16px;flex:1;min-width:150px}button,a.action{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}button.primary,a.action{background:#315fe0;color:white}button.secondary{background:#eaf0ff;color:#2548a4}button.done{background:#e5f6ee;color:#087b50}.stats{font-size:22px;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#e7edf5;border-radius:20px;overflow:hidden}.fill{height:100%;background:#30a77b;transition:width .2s}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{background:#eef2f8;color:#41516d}.filters button.active{background:#243f83;color:white}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 0;border-bottom:1px solid #e9edf3}.item:last-child{border:0}.item strong{font-size:18px}.item small{display:block;color:#69778e;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#66758d;font-size:14px}.hidden{display:none}.mine{background:#f0f5ff;padding:8px 10px;border-radius:9px;color:#3153a0;font-size:13px}.warning{color:#a26114}.foot{font-size:13px;color:#66758d;margin-top:20px}@media(max-width:600px){.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions>*{flex:1;text-align:center}}</style></head><body><div class="wrap"><header><h1>📋 사회문제탐구 설문조사</h1><div>친구들의 설문에 참여하고, 완료한 설문을 체크해 보세요.</div></header><section class="panel" id="loginPanel"><h2>내 학번 입력</h2><p class="muted">학번 5자리를 입력해 주세요. 같은 기기와 브라우저에서 완료 기록이 유지됩니다.</p><div class="login"><input id="studentId" inputmode="numeric" maxlength="5" placeholder="예: 20703"><button class="primary" id="start">시작하기</button></div><p id="error" class="warning" role="alert"></p></section><main id="main" class="hidden"><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b id="greeting"></b><button class="secondary" id="switch">학번 변경</button></div><p class="muted">본인이 만든 설문은 참여 대상에서 제외됩니다.</p><div class="stats" id="stats"></div><div class="bar"><div class="fill" id="fill"></div></div><p class="muted" id="remaining"></p></section><section class="panel"><div class="filters"><button data-filter="all" class="active">전체</button><button data-filter="todo">미완료</button><button data-filter="done">완료</button></div><div id="list"></div></section><p class="foot">※ 실제 구글 폼 제출 여부는 자동 확인되지 않습니다. 제출한 뒤 '완료 표시'를 눌러 주세요. 기록은 현재 브라우저에만 저장됩니다.</p></main></div><script>
const data = [
['20514','https://docs.google.com/forms/d/e/1FAIpQLScocgbQCDiL4eG6BkC-U0JGwNIJPzdMEkGFZJe4E9dBtk-x-w/viewform?usp=publish-editor'],
['20606',''],
['20608','https://docs.google.com/forms/d/e/1FAIpQLSfmVbMs0k7McbxHiulRzD24kHdf12xn0-Ge9kIR2ZVQAlIGmw/viewform?usp=publish-editor'],
['20609','https://docs.google.com/forms/d/e/1FAIpQLSctW3G1AAvsbpAQK-4UcsNYS5atjUdEHMUxJufVgGKZUoD0Vw/viewform?usp=publish-editor'],
['20623','https://docs.google.com/forms/d/e/1FAIpQLSdgyt3JqzBeTUHW-VfR81vU32qLK6F3w1jbgPUen-zHoxTPtw/viewform?usp=publish-editor'],
['20703','https://forms.gle/VEqDdC6GGYMomyEm8'],
['20704','https://docs.google.com/forms/d/e/1FAIpQLSdrCnptbjc20PjmD4WuGO9PU8Ze7nHHwLzWiOvRkai2PlhmNQ/viewform?usp=publish-editor'],
['20711','https://docs.google.com/forms/d/e/1FAIpQLSfpgImZmCMdx42x18YU5SDnDhfFyywTW0WgxnQh6n__PmNcqQ/viewform?usp=header'],
['20716','https://forms.gle/1GaDVKdTPb6zfnWP9'],
['20718','https://docs.google.com/forms/d/e/1FAIpQLSclpKud1_aq--s6JsDXV37yOVc2-l9crlIPCrqstqBIoL7NFg/viewform?usp=publish-editor'],
['20719','https://docs.google.com/forms/d/e/1FAIpQLScgnbadA57ArSopELM9kYrQoZixs0_vqK5YAPAkaniXp_whiw/viewform?usp=dialog'],
['20722','https://docs.google.com/forms/d/e/1FAIpQLSfnXuzjnhTg3HkZCiiAZNwrqn3HNDbvZsJFwWJaI4-DV-4Y8Q/viewform?usp=header'],
['20723','https://docs.google.com/forms/d/e/1FAIpQLSflOLosVA5og9l7pBSvcoqBOlszyCxaVK9NhZxMhFgi_0tOfw/viewform?usp=dialog'],
['20801','https://docs.google.com/forms/d/e/1FAIpQLSet8RDR8HRX0jUUZQpHqtz3aN0VK0xK3-YtLewTp927OcKGGw/viewform?usp=publish-editor'],
['20807','https://docs.google.com/forms/d/e/1FAIpQLSfgbTcZPomp4li18q8EYxlxpHF6YzrMry4e9xjHUb4yelWXzQ/viewform?usp=publish-editor'],
['20808','https://docs.google.com/forms/d/e/1FAIpQLSf7wjnuAH7p9Kz5pCU9pjurDrqOQAK1bJ5oMzVyYmOhKP9D8A/viewform?usp=publish-editor'],
['20809','https://docs.google.com/forms/d/e/1FAIpQLSdaTwAZGVdXBpyf0ACGT1WB6zmNnEtzWtYo7a7ehRLic75nFA/viewform?usp=publish-editor'],
['20812','https://forms.gle/vPvPYjD9m1pHLwhJ9'],
['20813','https://docs.google.com/forms/d/e/1FAIpQLSc_NT5rLSMe9MRacky1jZxgBk0Lokn_pzh8-HUnNeDtPXiqbA/viewform?usp=publish-editor'],
['20816','https://forms.gle/poLnsrRC34mST6gh7'],
['20817','https://docs.google.com/forms/d/e/1FAIpQLSc1S_YwB4GbP8KocaU-nwNt4hmNjULB1PY0RFaKbxYhKc9uXA/viewform'],
['20825','https://docs.google.com/forms/d/e/1FAIpQLSfgmbE9NAdcWAeUf01JWKLIShzv4CszrkeFF-6xCm2r-L2NNw/viewform?usp=publish-editor'],
['20915','https://docs.google.com/forms/d/e/1FAIpQLSd_h68NTIo_50gpE6Ry_V8D5iyG-bL3Om-iShfIhrHfaOSkKA/viewform?usp=dialog'],
['20919','https://docs.google.com/forms/d/e/1FAIpQLScNOcSJ62mWlDZRH9giUIGfBqGUvnjuX1uU1dnsw7huX-94Bw/viewform?usp=dialog'],
['20922','https://docs.google.com/forms/d/e/1FAIpQLSfEeBBewf9NajQwwmakAL7IzM3qi-lFpNFUC2MOHLg4HRKc1g/viewform?usp=publish-editor']
];
let id=localStorage.getItem('survey_current_student')||'',filter='all';const $=s=>document.querySelector(s);const eligible=()=>data.filter(([n,url])=>url&&n!==id);const key=()=>`survey_completed_v1_${id}`;const completed=()=>{try{return JSON.parse(localStorage.getItem(key())||'[]')}catch{return []}};
function start(){const v=$('#studentId').value.trim();if(!/^\d{5}$/.test(v)){ $('#error').textContent='학번 5자리를 입력해 주세요.';return}id=v;localStorage.setItem('survey_current_student',id);$('#loginPanel').classList.add('hidden');$('#main').classList.remove('hidden');render()}
function render(){const done=completed(),items=eligible(),count=items.filter(([n])=>done.includes(n)).length;$('#greeting').textContent=id+' 학생의 참여 현황';$('#stats').textContent=`${count} / ${items.length}개 완료`;$('#fill').style.width=(items.length?100*count/items.length:0)+'%';$('#remaining').textContent=count===items.length?'🎉 참여 가능한 설문을 모두 완료했어요!':`남은 설문 ${items.length-count}개`;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const list=$('#list');list.replaceChildren();for(const [n,url] of data){const mine=n===id,available=!!url,isDone=done.includes(n);if(filter==='todo'&&(mine||!available||isDone))continue;if(filter==='done'&&(mine||!available||!isDone))continue;const row=document.createElement('div');row.className='item';const left=document.createElement('div');const title=document.createElement('strong');title.textContent=n+' 설문조사';const subtitle=document.createElement('small');subtitle.textContent=mine?'내가 만든 설문':!available?'설문 주소 준비 중':isDone?'✓ 참여 완료':'아직 참여하지 않음';left.append(title,subtitle);row.append(left);const actions=document.createElement('div');actions.className='actions';if(mine){const b=document.createElement('span');b.className='mine';b.textContent='내 설문';actions.append(b)}else if(available){const a=document.createElement('a');a.className='action';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='설문 참여하기 ↗';actions.append(a);const b=document.createElement('button');b.className=isDone?'done':'secondary';b.textContent=isDone?'✓ 완료 취소':'완료 표시';b.onclick=()=>{const set=new Set(completed());isDone?set.delete(n):set.add(n);localStorage.setItem(key(),JSON.stringify([...set]));render()};actions.append(b)}else{const b=document.createElement('span');b.className='warning';b.textContent='준비 중';actions.append(b)}row.append(actions);list.append(row)}if(!list.children.length){const p=document.createElement('p');p.className='muted';p.textContent='이 조건에 해당하는 설문이 없습니다.';list.append(p)}}
$('#start').onclick=start;$('#studentId').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('#switch').onclick=()=>{$('#main').classList.add('hidden');$('#loginPanel').classList.remove('hidden');$('#studentId').value=id;$('#error').textContent=''};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});if(id){$('#studentId').value=id;$('#loginPanel').classList.add('hidden');$('#main').classList.remove('hidden');render()}
</script></body></html>
